name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  hygiene-and-main-gate:
    name: Verify Release Ancestor & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
          echo "Verified release commit $GITHUB_SHA is on origin/main"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository hygiene & manifest check
        run: node scripts/check-hygiene.mjs

  release:
    name: Build Universal Release & Publish
    needs: hygiene-and-main-gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "Invalid release tag: $TAG (must start with 'v' followed by version number, e.g. v1.0.0)"
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag resolved: ${TAG}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Unit Tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build Universal macOS Binary & Extension Bundles
        run: pnpm build:universal

      - name: Verify Standalone Bundles, --self-test & 5-way flock
        run: pnpm verify:ci

      - name: Package Release Archives
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p release/bundle-staging

          /usr/bin/ditto -c -k --keepParent dist/tiny-devkit "release/tiny-devkit-${TAG}-macos-universal.zip"
          /usr/bin/ditto -c -k --keepParent dist/tiny-shortcuts "release/tiny-shortcuts-${TAG}-macos-universal.zip"

          cp -R dist/tiny-devkit release/bundle-staging/
          cp -R dist/tiny-shortcuts release/bundle-staging/
          cp README.md LICENSE release/bundle-staging/
          cat > release/bundle-staging/install.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          TARGET_DIR="$HOME/Library/Application Support/com.abueammar.tinycast/extensions"
          pkill -f tinycast-devkit || true
          mkdir -p "$TARGET_DIR"
          for ext in tiny-devkit tiny-shortcuts; do
            rm -rf "$TARGET_DIR/$ext"
            cp -R "$SCRIPT_DIR/$ext" "$TARGET_DIR/$ext"
            chmod +x "$TARGET_DIR/$ext/assets/tinycast-devkit"
            echo "Installed $ext -> $TARGET_DIR/$ext"
          done
          echo "Done! Restart Tinycast (or refresh Extensions in Settings) to activate."
          EOF
          chmod +x release/bundle-staging/install.sh

          (
            cd release/bundle-staging
            /usr/bin/zip -ry "../tinycast-extensions-bundle-${TAG}-macos-universal.zip" tiny-devkit tiny-shortcuts install.sh README.md LICENSE
          )
          rm -rf release/bundle-staging

          (
            cd release
            shasum -a 256 *.zip > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Tinycast Extensions ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            ## 安装说明 (macOS 15+ Apple Silicon & Intel Universal)

            ### 方式一：一键整合包安装（无需 Xcode / Node 环境）
            1. 下载 **`tinycast-extensions-bundle-${{ steps.meta.outputs.tag }}-macos-universal.zip`** 并解压。
            2. 在终端运行解压目录中的 `./install.sh`，或打开 **Tinycast 设置 → 扩展 → 安装 → Add from folder** 分别选取其中的 `tiny-devkit` 与 `tiny-shortcuts`。
            3. 重启 Tinycast 即可使用全部 20 个命令（含独立纯原生 SwiftUI 悬浮工具窗）。

            ### 方式二：按需单独安装
            - 仅安装开发者工具箱：下载 `tiny-devkit-${{ steps.meta.outputs.tag }}-macos-universal.zip`，解压后通过 Tinycast **Add from folder** 选取 `tiny-devkit`。
            - 仅安装效率快捷入口：下载 `tiny-shortcuts-${{ steps.meta.outputs.tag }}-macos-universal.zip`，解压后通过 Tinycast **Add from folder** 选取 `tiny-shortcuts`。

            > 校验文件：`SHA256SUMS.txt` 可用于核对压缩包完整性 (`shasum -a 256 -c SHA256SUMS.txt`)。
